<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="12" fill="#0A0A0B"/>
  <!-- Pediment (triangular roof) -->
  <path d="M32 9 L57 24 L7 24 Z" stroke="#C8C8D0" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Cornice line under pediment -->
  <line x1="6" y1="24" x2="58" y2="24" stroke="#C8C8D0" stroke-width="1.6"/>
  <!-- Architrave (top beam) -->
  <rect x="8" y="25" width="48" height="3.5" stroke="#C8C8D0" stroke-width="1.4"/>
  <!-- Three columns -->
  <g stroke="#C8C8D0" stroke-width="1.4">
    <!-- Column 1 -->
    <rect x="12" y="30" width="7" height="16"/>
    <line x1="14.5" y1="32" x2="14.5" y2="44"/>
    <line x1="16.5" y1="32" x2="16.5" y2="44"/>
    <rect x="11.5" y="28.5" width="8" height="2.2"/>
    <rect x="11.5" y="45.8" width="8" height="2.2"/>
    <!-- Column 2 -->
    <rect x="28.5" y="30" width="7" height="16"/>
    <line x1="31" y1="32" x2="31" y2="44"/>
    <line x1="33" y1="32" x2="33" y2="44"/>
    <rect x="28" y="28.5" width="8" height="2.2"/>
    <rect x="28" y="45.8" width="8" height="2.2"/>
    <!-- Column 3 -->
    <rect x="45" y="30" width="7" height="16"/>
    <line x1="47.5" y1="32" x2="47.5" y2="44"/>
    <line x1="49.5" y1="32" x2="49.5" y2="44"/>
    <rect x="44.5" y="28.5" width="8" height="2.2"/>
    <rect x="44.5" y="45.8" width="8" height="2.2"/>
  </g>
  <!-- Stepped base (crepidoma) -->
  <rect x="7" y="48" width="50" height="3" stroke="#C8C8D0" stroke-width="1.4"/>
  <rect x="4" y="51" width="56" height="3" stroke="#C8C8D0" stroke-width="1.4"/>
  <rect x="2" y="54" width="60" height="3" stroke="#C8C8D0" stroke-width="1.4"/>
</svg>
